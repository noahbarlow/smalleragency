<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <style>
    @font-face{font-family:"Objectivity";src:url("../fonts/objectivity-regular.woff2") format("woff2");font-weight:400}
    @font-face{font-family:"Objectivity";src:url("../fonts/objectivity-bold.woff2") format("woff2");font-weight:700}
    @font-face{font-family:"Instrument Serif";src:url("../fonts/instrument-serif-regular.woff2") format("woff2");font-style:normal}
    @font-face{font-family:"Instrument Serif";src:url("../fonts/instrument-serif-italic.woff2") format("woff2");font-style:italic}

    :root{
      --white:#fbfbf7;
      --navy:#171b54;
      --navy-dark:#0f123e;
      --acid:#e2ff08;
      --serif:"Instrument Serif",Georgia,serif;
      --sans:"Objectivity",Arial,sans-serif;
    }

    *{box-sizing:border-box}
    html,body{width:1200px;height:630px;margin:0;overflow:hidden}
    body{font-family:var(--sans);background:var(--navy);color:var(--white)}

    .card{
      position:relative;
      width:1200px;
      height:630px;
      overflow:hidden;
      background:radial-gradient(circle at 82% 10%,#7683b5 0,#444d8d 23%,var(--navy) 59%,var(--navy-dark) 100%);
    }

    .masthead{position:absolute;z-index:5;left:56px;top:40px;width:146px}
    .masthead img{display:block;width:100%;height:auto;filter:invert(1)}
    .meta{position:absolute;z-index:5;left:56px;top:112px;font-size:12px;font-weight:700;letter-spacing:.115em;text-transform:uppercase}
    .meta span{color:var(--acid);padding:0 8px}

    h1{position:absolute;z-index:5;left:54px;top:142px;margin:0;line-height:.78;letter-spacing:-.045em}
    h1 span{display:block;white-space:nowrap}
    .serious{font-family:var(--serif);font-size:103px;font-weight:400}
    .brand{font-size:77px;font-weight:700;letter-spacing:-.075em}
    .small{margin-top:8px;font-family:var(--serif);font-size:94px;font-style:italic;font-weight:400}
    .overhead{margin:4px 0 0 42px;color:var(--acid);font-size:81px;font-weight:700;letter-spacing:-.075em}

    .intro{position:absolute;z-index:5;left:58px;bottom:47px;width:535px;margin:0;font-size:18px;line-height:1.35}
    .site{position:absolute;z-index:5;right:55px;bottom:30px;margin:0;color:var(--white);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}

    .art{position:absolute;z-index:2;right:55px;top:86px;width:452px;height:474px;display:grid;grid-template-columns:1.08fr .92fr;grid-template-rows:1fr 1fr;gap:10px}
    .shot{position:relative;overflow:hidden;background:#24263c}
    .shot img{display:block;width:100%;height:100%;object-fit:cover}
    .shot--grolsch{grid-column:1;grid-row:1/3}
    .shot--grolsch img{object-position:61% center}
    .shot--dime{grid-column:2;grid-row:1}
    .shot--dime img{object-position:center 41%}
    .shot--supa{grid-column:2;grid-row:2}
    .shot--supa img{object-position:37% center}
    .label{position:absolute;z-index:4;right:-1px;top:-25px;margin:0;padding:10px 13px;background:var(--acid);color:#080909;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .label b{margin-right:6px;font-size:15px}

    .rule{position:absolute;z-index:4;left:56px;right:55px;bottom:23px;height:1px;background:rgba(251,251,247,.55)}
  </style>
</head>
<body>
  <main class="card">
    <a class="masthead"><img src="../logo.svg" alt="Smaller Agency"></a>
    <p class="meta">Brand strategy <span>/</span> Identity <span>/</span> Packaging</p>

    <h1>
      <span class="serious">Serious</span>
      <span class="brand">brand work.</span>
      <span class="small">Small-team</span>
      <span class="overhead">overhead.</span>
    </h1>

    <p class="intro">We build consumer brands from the useful idea<br>to the thing people pick up.</p>

    <section class="art" aria-label="Selected Smaller Agency work">
      <figure class="shot shot--grolsch"><img src="../img/grolsch-ooh.jpg" alt=""></figure>
      <figure class="shot shot--dime"><img src="../img/dimebag-hero.webp" alt=""></figure>
      <figure class="shot shot--supa"><img src="../img/supa-strength.jpg" alt=""></figure>
      <p class="label"><b>✦</b> Pack / shelf / culture</p>
    </section>

    <div class="rule"></div>
    <p class="site">smalleragency.com</p>
  </main>
</body>
</html>
